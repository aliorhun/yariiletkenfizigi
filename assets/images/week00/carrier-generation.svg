<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" role="img" aria-labelledby="t d">
<title id="t">Electron-hole pair generation in intrinsic silicon</title>
<desc id="d">Original educational diagram showing covalent bonds in silicon, thermal excitation of an electron, a mobile conduction electron, and the corresponding hole left in the valence bond.</desc>
<rect width="900" height="430" rx="20" fill="#f8fafc"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.h{font-size:25px;font-weight:700}.lab{font-size:18px;font-weight:700}.sm{font-size:16px;fill:#64748b}
.bond{stroke:#94a3b8;stroke-width:5;stroke-linecap:round}.atom{fill:#2563eb}.electron{fill:#2563eb}.hole{fill:none;stroke:#dc2626;stroke-width:5}.arrow{stroke:#d97706;stroke-width:4;fill:none}
</style>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker></defs>
<text x="42" y="48" class="h">Intrinsic Si: thermal energy creates an electron–hole pair</text>

<g transform="translate(35 95)">
  <text x="0" y="0" class="lab">1 · Bound valence electrons</text>
  <line x1="85" y1="120" x2="205" y2="120" class="bond"/><line x1="145" y1="60" x2="145" y2="180" class="bond"/>
  <circle cx="85" cy="120" r="30" class="atom"/><circle cx="205" cy="120" r="30" class="atom"/><circle cx="145" cy="60" r="30" class="atom"/><circle cx="145" cy="180" r="30" class="atom"/>
  <text x="74" y="127" font-size="19" fill="#fff">Si</text><text x="194" y="127" font-size="19" fill="#fff">Si</text><text x="134" y="67" font-size="19" fill="#fff">Si</text><text x="134" y="187" font-size="19" fill="#fff">Si</text>
  <circle cx="135" cy="120" r="7" class="electron"/><circle cx="155" cy="120" r="7" class="electron"/>
  <text x="55" y="245" class="sm">electrons participate in covalent bonds</text>
</g>

<path d="M330 215 C365 175 390 175 425 215" class="arrow" marker-end="url(#a)"/>
<text x="343" y="158" class="lab">thermal / optical energy</text>
<text x="369" y="184" class="sm">≥ band-gap scale</text>

<g transform="translate(475 95)">
  <text x="0" y="0" class="lab">2 · Mobile carriers</text>
  <line x1="85" y1="120" x2="205" y2="120" class="bond"/><line x1="145" y1="60" x2="145" y2="180" class="bond"/>
  <circle cx="85" cy="120" r="30" class="atom"/><circle cx="205" cy="120" r="30" class="atom"/><circle cx="145" cy="60" r="30" class="atom"/><circle cx="145" cy="180" r="30" class="atom"/>
  <text x="74" y="127" font-size="19" fill="#fff">Si</text><text x="194" y="127" font-size="19" fill="#fff">Si</text><text x="134" y="67" font-size="19" fill="#fff">Si</text><text x="134" y="187" font-size="19" fill="#fff">Si</text>
  <circle cx="135" cy="120" r="7" class="electron"/>
  <circle cx="155" cy="120" r="10" class="hole"/>
  <circle cx="275" cy="62" r="12" class="electron"/>
  <path d="M170 104 C205 70 230 65 260 64" class="arrow" marker-end="url(#a)"/>
  <text x="238" y="35" class="lab">e⁻</text><text x="238" y="84" class="sm">free electron</text>
  <text x="118" y="232" class="lab" fill="#dc2626">h⁺</text><text x="95" y="256" class="sm">hole = missing bond electron</text>
</g>

<rect x="42" y="370" width="816" height="38" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="63" y="395" class="sm">One excitation creates both carriers together: intrinsic equilibrium ⇒ n = p = nᵢ.</text>
</svg>