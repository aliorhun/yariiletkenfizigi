<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 590" role="img" aria-labelledby="t d">
<title id="t">Carrier concentration versus temperature in donor-doped silicon</title>
<desc id="d">Original conceptual graph for donor-doped silicon showing freeze-out, extrinsic and intrinsic temperature regions, donor concentration, electron density and intrinsic carrier concentration.</desc>
<rect width="1040" height="590" rx="22" fill="#f8fafc"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:27px;font-weight:700}.axis{font-size:16px;fill:#475569}.tick{font-size:14px;fill:#64748b}.reg{font-size:17px;font-weight:700}.small{font-size:14px;fill:#64748b}.grid{stroke:#e2e8f0;stroke-width:1}.ax{stroke:#334155;stroke-width:2}.solid{stroke:#0284c7;stroke-width:5;fill:none}.dash{stroke:#111827;stroke-width:4;fill:none;stroke-dasharray:10 8}.nd{stroke:#d97706;stroke-width:3;stroke-dasharray:7 6}
</style>
<text x="45" y="45" class="title">Donor-doped Si: why three temperature regions appear</text>

<rect x="95" y="90" width="165" height="390" fill="#dbeafe" opacity=".32"/>
<rect x="260" y="90" width="470" height="390" fill="#dcfce7" opacity=".30"/>
<rect x="730" y="90" width="225" height="390" fill="#fee2e2" opacity=".34"/>

<line x1="95" y1="135" x2="955" y2="135" class="grid"/><line x1="95" y1="210" x2="955" y2="210" class="grid"/><line x1="95" y1="285" x2="955" y2="285" class="grid"/><line x1="95" y1="360" x2="955" y2="360" class="grid"/><line x1="95" y1="435" x2="955" y2="435" class="grid"/>
<line x1="95" y1="480" x2="955" y2="480" class="ax"/><line x1="95" y1="480" x2="95" y2="90" class="ax"/>

<line x1="95" y1="480" x2="95" y2="488" class="ax"/><text x="85" y="513" class="tick">0</text><line x1="238" y1="480" x2="238" y2="488" class="ax"/><text x="228" y="513" class="tick">100</text><line x1="382" y1="480" x2="382" y2="488" class="ax"/><text x="372" y="513" class="tick">200</text><line x1="525" y1="480" x2="525" y2="488" class="ax"/><text x="515" y="513" class="tick">300</text><line x1="668" y1="480" x2="668" y2="488" class="ax"/><text x="658" y="513" class="tick">400</text><line x1="812" y1="480" x2="812" y2="488" class="ax"/><text x="802" y="513" class="tick">500</text><line x1="955" y1="480" x2="955" y2="488" class="ax"/><text x="945" y="513" class="tick">600</text>
<line x1="87" y1="435" x2="95" y2="435" class="ax"/><text x="42" y="440" class="tick">10⁸</text><line x1="87" y1="360" x2="95" y2="360" class="ax"/><text x="42" y="365" class="tick">10¹⁰</text><line x1="87" y1="285" x2="95" y2="285" class="ax"/><text x="42" y="290" class="tick">10¹²</text><line x1="87" y1="210" x2="95" y2="210" class="ax"/><text x="42" y="215" class="tick">10¹⁵</text><line x1="87" y1="135" x2="95" y2="135" class="ax"/><text x="42" y="140" class="tick">10¹⁷</text>

<text x="480" y="552" class="axis">Temperature T (K)</text>
<text x="20" y="355" transform="rotate(-90 20 355)" class="axis">Carrier concentration (cm⁻³, log scale)</text>

<line x1="95" y1="210" x2="955" y2="210" class="nd"/><text x="800" y="198" class="small">N_D = 10¹⁵ cm⁻³</text>

<path d="M105 450 C140 438 165 400 190 330 C215 260 238 220 285 211 C390 208 560 210 690 210 C730 210 758 204 785 190 C820 170 850 140 890 105 C915 84 935 77 950 72" class="solid"/>
<path d="M105 468 C320 468 520 465 650 455 C735 448 785 400 825 325 C860 260 895 175 935 85" class="dash"/>

<circle cx="817" cy="212" r="7" fill="#dc2626"/><line x1="817" y1="212" x2="817" y2="260" stroke="#dc2626" stroke-width="2"/><text x="752" y="282" class="small">nᵢ ≈ N_D</text>

<text x="120" y="122" class="reg">Freeze-out</text><text x="125" y="145" class="small">donors not fully ionized</text>
<text x="420" y="122" class="reg">Extrinsic</text><text x="390" y="145" class="small">n ≈ N_D, doping controls carriers</text>
<text x="785" y="122" class="reg">Intrinsic</text><text x="770" y="145" class="small">thermal generation dominates</text>

<text x="525" y="194" fill="#0284c7" font-size="15" font-weight="700">electron density n</text>
<text x="815" y="345" font-size="15" font-weight="700">intrinsic nᵢ</text>

<g transform="translate(105 530)">
  <line x1="0" y1="0" x2="48" y2="0" class="solid"/><text x="58" y="5" class="small">n(T)</text>
  <line x1="125" y1="0" x2="173" y2="0" class="dash"/><text x="183" y="5" class="small">nᵢ(T)</text>
  <line x1="250" y1="0" x2="298" y2="0" class="nd"/><text x="308" y="5" class="small">N_D</text>
</g>
<text x="660" y="565" class="small">Conceptual teaching plot; transition temperatures depend on dopant and material parameters.</text>
</svg>