<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d">
<title id="t">Silicon CMOS, GaN HEMT and vertical SiC power device comparison</title><desc id="d">Original educational cross-section comparison of three semiconductor device technology families.</desc>
<rect width="1200" height="560" rx="22" fill="#f8fafc"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:27px;font-weight:700}.h{font-size:21px;font-weight:700}.s{font-size:15px;fill:#64748b}.lab{font-size:14px}.outline{stroke:#334155;stroke-width:2}.arrow{stroke:#15803d;stroke-width:4;fill:none}</style>
<text x="45" y="52" class="title">Three device families: where current flows and why the materials differ</text>
<g transform="translate(35 90)"><rect width="350" height="400" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="22" y="37" class="h">Si CMOS transistor</text><text x="22" y="62" class="s">dense logic • low voltage • lateral channel</text>
<rect x="35" y="255" width="280" height="95" fill="#dbeafe" class="outline"/><rect x="55" y="220" width="80" height="35" fill="#93c5fd" class="outline"/><rect x="215" y="220" width="80" height="35" fill="#93c5fd" class="outline"/><rect x="145" y="183" width="60" height="55" fill="#fde68a" class="outline"/><rect x="140" y="238" width="70" height="12" fill="#f8fafc" class="outline"/>
<text x="60" y="214" class="lab">source</text><text x="231" y="214" class="lab">drain</text><text x="157" y="174" class="lab">gate</text><text x="129" y="377" class="lab">silicon substrate</text><path d="M105 267H245" class="arrow"/><text x="118" y="293" class="lab">lateral channel</text></g>
<g transform="translate(425 90)"><rect width="350" height="400" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="22" y="37" class="h">GaN-on-Si HEMT</text><text x="22" y="62" class="s">fast switching • lateral 2DEG channel</text>
<rect x="35" y="295" width="280" height="55" fill="#dbeafe" class="outline"/><text x="120" y="329" class="lab">Si substrate</text><rect x="35" y="230" width="280" height="65" fill="#bfdbfe" class="outline"/><text x="140" y="268" class="lab">GaN</text><rect x="35" y="205" width="280" height="25" fill="#ddd6fe" class="outline"/><text x="125" y="198" class="lab">AlGaN barrier</text><rect x="65" y="165" width="60" height="40" fill="#94a3b8" class="outline"/><rect x="225" y="165" width="60" height="40" fill="#94a3b8" class="outline"/><rect x="145" y="145" width="60" height="60" fill="#fde68a" class="outline"/><text x="78" y="153" class="lab">S</text><text x="248" y="153" class="lab">D</text><text x="168" y="136" class="lab">G</text><path d="M95 237H255" class="arrow"/><text x="136" y="255" class="lab">2DEG</text></g>
<g transform="translate(815 90)"><rect width="350" height="400" rx="16" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="22" y="37" class="h">Vertical SiC power device</text><text x="22" y="62" class="s">high voltage • high field • vertical current</text>
<rect x="55" y="310" width="240" height="40" fill="#94a3b8" class="outline"/><text x="135" y="337" class="lab">drain metal</text><rect x="55" y="175" width="240" height="135" fill="#dcfce7" class="outline"/><text x="123" y="250" class="lab">SiC drift region</text><rect x="80" y="140" width="70" height="35" fill="#bbf7d0" class="outline"/><rect x="200" y="140" width="70" height="35" fill="#bbf7d0" class="outline"/><rect x="145" y="105" width="60" height="70" fill="#fde68a" class="outline"/><text x="94" y="132" class="lab">source</text><text x="158" y="96" class="lab">gate</text><path d="M175 180V295" class="arrow"/><text x="188" y="225" class="lab">vertical current</text></g>
<text x="45" y="535" class="s">The drawings are conceptual, not to scale. Device details vary by manufacturer and generation.</text>
</svg>