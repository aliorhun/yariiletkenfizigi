<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Semiconductor fabrication flow</title><desc id="d">Original educational schematic showing a simplified wafer-to-package semiconductor fabrication flow.</desc>
<rect width="1200" height="520" rx="22" fill="#f8fafc"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.title{font-size:27px;font-weight:700}.step{font-size:18px;font-weight:700}.sub{font-size:14px;fill:#64748b}
.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.arrow{stroke:#d97706;stroke-width:4;fill:none}.n{fill:#d97706}.icon{stroke:#2563eb;stroke-width:3;fill:none}
</style>
<text x="48" y="52" class="title">Wafer → device → package: simplified fabrication flow</text>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#d97706"/></marker></defs>
<g transform="translate(45 95)"><rect width="245" height="145" rx="14" class="box"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" font-size="18" font-weight="700" fill="#fff">1</text><text x="67" y="39" class="step">Wafer</text><text x="22" y="126" class="sub">single-crystal substrate</text>
<g transform="translate(77 57)" class="icon"><ellipse cx="45" cy="25" rx="58" ry="15"/><path d="M-13 25v25c0 8 26 15 58 15s58-7 58-15V25"/></g></g><g transform="translate(330 95)"><rect width="245" height="145" rx="14" class="box"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" font-size="18" font-weight="700" fill="#fff">2</text><text x="67" y="39" class="step">Deposit / oxidize</text><text x="22" y="126" class="sub">SiO₂, dielectric, epi</text>
<g transform="translate(77 57)" class="icon"><rect x="-10" y="33" width="110" height="24"/><path d="M-10 26h110"/><path d="M10 16h70"/></g></g><g transform="translate(615 95)"><rect width="245" height="145" rx="14" class="box"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" font-size="18" font-weight="700" fill="#fff">3</text><text x="67" y="39" class="step">Photoresist</text><text x="22" y="126" class="sub">coat + soft bake</text>
<g transform="translate(77 57)" class="icon"><ellipse cx="45" cy="30" rx="55" ry="14"/><path d="M-10 30v26h110V30"/><path d="M0 18h90" stroke="#dc2626"/></g></g><g transform="translate(900 95)"><rect width="245" height="145" rx="14" class="box"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" font-size="18" font-weight="700" fill="#fff">4</text><text x="67" y="39" class="step">Lithography</text><text x="22" y="126" class="sub">pattern transfer</text>
<g transform="translate(77 57)" class="icon"><rect x="-7" y="8" width="104" height="52"/><path d="M8 8v52M38 8v52M70 8v52"/><path d="M-17 70h124" stroke="#d97706"/></g></g><g transform="translate(45 300)"><rect width="245" height="145" rx="14" class="box"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" font-size="18" font-weight="700" fill="#fff">5</text><text x="67" y="39" class="step">Etch</text><text x="22" y="126" class="sub">remove selected layers</text>
<g transform="translate(77 57)" class="icon"><path d="M-10 12h110v25H75v28H20V37h-30z"/><path d="M-10 75h110" stroke="#dc2626"/></g></g><g transform="translate(330 300)"><rect width="245" height="145" rx="14" class="box"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" font-size="18" font-weight="700" fill="#fff">6</text><text x="67" y="39" class="step">Dope + anneal</text><text x="22" y="126" class="sub">implant / diffusion</text>
<g transform="translate(77 57)" class="icon"><path d="M-10 68h110"/><path d="M10 10v40M35 10v40M60 10v40M85 10v40"/><path d="M5 47l5 8 5-8M30 47l5 8 5-8M55 47l5 8 5-8M80 47l5 8 5-8"/></g></g><g transform="translate(615 300)"><rect width="245" height="145" rx="14" class="box"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" font-size="18" font-weight="700" fill="#fff">7</text><text x="67" y="39" class="step">Metallization</text><text x="22" y="126" class="sub">contacts + interconnect</text>
<g transform="translate(77 57)" class="icon"><rect x="-10" y="48" width="110" height="20"/><path d="M5 42V22h25v20M45 42V10h25v32M82 42V28h18v14" stroke="#d97706"/></g></g><g transform="translate(900 300)"><rect width="245" height="145" rx="14" class="box"/><circle cx="34" cy="34" r="20" class="n"/><text x="28" y="41" font-size="18" font-weight="700" fill="#fff">8</text><text x="67" y="39" class="step">Test + package</text><text x="22" y="126" class="sub">dice, bond, encapsulate</text>
<g transform="translate(77 57)" class="icon"><rect x="5" y="8" width="80" height="65" rx="8"/><rect x="23" y="24" width="44" height="32"/><path d="M5 20H-10M5 35H-10M5 50H-10M85 20h15M85 35h15M85 50h15"/></g></g>
<line x1="290" y1="168" x2="325" y2="168" class="arrow" marker-end="url(#a)"/><line x1="575" y1="168" x2="610" y2="168" class="arrow" marker-end="url(#a)"/><line x1="860" y1="168" x2="895" y2="168" class="arrow" marker-end="url(#a)"/>
<path d="M1110 168 C1160 168 1160 290 1110 290" class="arrow" marker-end="url(#a)"/>
<line x1="1110" y1="373" x2="1075" y2="373" class="arrow" marker-end="url(#a)"/><line x1="825" y1="373" x2="790" y2="373" class="arrow" marker-end="url(#a)"/><line x1="540" y1="373" x2="505" y2="373" class="arrow" marker-end="url(#a)"/>
<text x="48" y="500" class="sub">Actual process order repeats lithography / deposition / etch / implant many times; this diagram is intentionally simplified.</text>
</svg>