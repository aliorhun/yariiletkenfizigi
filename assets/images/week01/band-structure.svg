<style>text{font-family:Arial,Helvetica,sans-serif;fill:#1f2937}.s{stroke:#1f2937;stroke-width:3;fill:none}.thin{stroke:#cbd5e1;stroke-width:2;fill:none}.dash{stroke-dasharray:8 7}.lbl{font-size:20px;font-weight:700}.sm{font-size:16px;fill:#64748b}.tiny{font-size:14px;fill:#64748b}</style>

<g transform="translate(30 45)">
<circle cx="50" cy="50" r="12" fill="#d97706"/><circle cx="110" cy="30" r="12" fill="#2563eb"/><circle cx="170" cy="50" r="12" fill="#d97706"/><circle cx="80" cy="110" r="12" fill="#2563eb"/><circle cx="140" cy="90" r="12" fill="#d97706"/><circle cx="200" cy="110" r="12" fill="#2563eb"/><circle cx="50" cy="170" r="12" fill="#d97706"/><circle cx="110" cy="150" r="12" fill="#2563eb"/><circle cx="170" cy="170" r="12" fill="#d97706"/>
<path class="thin" d="M50 50L110 30L170 50M50 50L80 110L140 90L170 50M80 110L50 170L110 150L170 170L200 110M140 90L200 110M110 150L140 90"/>
