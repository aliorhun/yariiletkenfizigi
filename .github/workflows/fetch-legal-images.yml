name: Fetch verified open-license lesson photos

on:
  push:
    branches:
      - feat/legal-semiconductor-visuals
    paths:
      - .github/workflows/fetch-legal-images.yml

permissions:
  contents: write

jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/legal-semiconductor-visuals
          fetch-depth: 0

      - name: Download verified Wikimedia Commons originals
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/legal-images assets/images/real-world
          curl -fL --retry 3 -o /tmp/legal-images/silicon-wafer.jpg 'https://upload.wikimedia.org/wikipedia/commons/e/e2/Silicon_wafer.jpg'
          curl -fL --retry 3 -o /tmp/legal-images/reference-silicon-solar-cell.jpg 'https://upload.wikimedia.org/wikipedia/commons/a/a2/Reference_silicon_solar_cell.jpg'
          curl -fL --retry 3 -o /tmp/legal-images/cmos-image-sensor.jpg 'https://upload.wikimedia.org/wikipedia/commons/5/54/CMOS_image_sensor_chip-scale_package_top.jpg'
          curl -fL --retry 3 -o /tmp/legal-images/sic-wafers.jpg 'https://upload.wikimedia.org/wikipedia/commons/4/49/SiC_wafers_6inch.jpg'
          curl -fL --retry 3 -o /tmp/legal-images/igbt-module.jpg 'https://upload.wikimedia.org/wikipedia/commons/1/1d/Infineon_IGBT-Modul.jpg'
          curl -fL --retry 3 -o /tmp/legal-images/microprocessor.jpg 'https://upload.wikimedia.org/wikipedia/commons/0/01/Microprocessor.jpg'
          curl -fL --retry 3 -o /tmp/legal-images/radar-sensor.png 'https://upload.wikimedia.org/wikipedia/commons/8/86/Radar_Sensor_Golden_Sahara_II.png'
          curl -fL --retry 3 -o /tmp/legal-images/semiconductor-cleanroom.jpg 'https://upload.wikimedia.org/wikipedia/commons/5/50/Clean_room.jpg'

      - name: Resize local copies
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src=Path('/tmp/legal-images')
          dst=Path('assets/images/real-world')
          pairs=[
            ('silicon-wafer.jpg','silicon-wafer.jpg'),
            ('reference-silicon-solar-cell.jpg','reference-silicon-solar-cell.jpg'),
            ('cmos-image-sensor.jpg','cmos-image-sensor.jpg'),
            ('sic-wafers.jpg','sic-wafers.jpg'),
            ('igbt-module.jpg','igbt-module.jpg'),
            ('microprocessor.jpg','microprocessor.jpg'),
            ('radar-sensor.png','radar-sensor.jpg'),
            ('semiconductor-cleanroom.jpg','semiconductor-cleanroom.jpg'),
          ]
          for a,b in pairs:
              im=Image.open(src/a)
              im=ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((1280,1280), Image.Resampling.LANCZOS)
              im.save(dst/b, 'JPEG', quality=86, optimize=True, progressive=True)
              print(b, im.size)
          PY

      - name: Commit local image assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/images/real-world
          if git diff --cached --quiet; then
            echo 'No image changes to commit.'
            exit 0
          fi
          git commit -m 'assets: add verified open-license real-world photos'
          git push origin HEAD:feat/legal-semiconductor-visuals
